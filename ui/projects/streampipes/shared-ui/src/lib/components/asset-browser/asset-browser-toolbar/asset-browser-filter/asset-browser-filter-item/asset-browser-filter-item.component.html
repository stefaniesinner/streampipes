<div
    class="asset-filter-item"
    role="button"
    tabindex="0"
    [class.asset-filter-item-selected]="selected"
    [attr.aria-pressed]="selected"
    [attr.data-cy]="assetItem.dataCyId"
    [attr.title]="assetItem.asset.assetName"
    (click)="toggleAsset($event)"
    (keydown.enter)="toggleAssetByKey($event)"
    (keydown.space)="toggleAssetByKey($event)"
>
    <div class="asset-filter-item-header">
        <div class="asset-filter-item-icon-shell">
            <mat-icon>precision_manufacturing</mat-icon>
        </div>
        <div class="asset-filter-item-copy">
            <h5 class="asset-filter-item-title">
                {{ assetItem.asset.assetName }}
            </h5>
            <div class="asset-filter-item-meta">
                @if (assetItem.assetPath) {
                    <span
                        class="asset-filter-item-meta-item"
                        [attr.title]="assetItem.assetPath"
                        >{{ assetItem.assetPath }}</span
                    >
                }
                @if (assetItem.details) {
                    <span class="asset-filter-item-meta-item">{{
                        assetItem.details
                    }}</span>
                }
            </div>
        </div>
    </div>
    <div class="asset-filter-item-actions">
        <button
            mat-icon-button
            type="button"
            [attr.aria-label]="'Preview asset' | translate"
            [attr.title]="'Preview asset' | translate"
            [attr.data-cy]="assetItem.dataCyId + '-preview'"
            (click)="openPreview($event)"
        >
            <mat-icon>visibility</mat-icon>
        </button>
        <div class="asset-filter-item-indicator">
            <mat-icon>{{ selected ? 'check' : 'add' }}</mat-icon>
        </div>
    </div>
</div>
